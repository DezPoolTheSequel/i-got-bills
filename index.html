function CalendarView({ colors, allBills, period, onSelectBill }) {
  const [monthCursor, setMonthCursor] = useState(() => {
    const d = parseISO(period.start);
    return new Date(d.getFullYear(), d.getMonth(), 1);
  });

  const year = monthCursor.getFullYear();
  const month = monthCursor.getMonth();
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const billsByDate = useMemo(() => {
    const map = {};
    allBills.forEach((b) => {
      if (!map[b.dueDate]) map[b.dueDate] = [];
      map[b.dueDate].push(b);
    });
    return map;
  }, [allBills]);

  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const today = todayISO();

  return (
    <div style={{ paddingTop: 4 }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
        <button onClick={() => setMonthCursor(new Date(year, month - 1, 1))} aria-label="Previous month" style={{ border: 'none', background: 'transparent', color: colors.textMuted, cursor: 'pointer', padding: 6, display: 'flex' }}>
          <ChevronLeftIcon size={16} />
        </button>
        <div style={{ fontSize: 14, fontWeight: 600 }}>{MONTH_NAMES[month]} {year}</div>
        <button onClick={() => setMonthCursor(new Date(year, month + 1, 1))} aria-label="Next month" style={{ border: 'none', background: 'transparent', color: colors.textMuted, cursor: 'pointer', padding: 6, display: 'flex' }}>
          <ChevronRightIcon size={16} />
        </button>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 4, marginBottom: 6 }}>
        {['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((d, i) => (
          <div key={i} style={{ textAlign: 'center', fontSize: 11, color: colors.textMuted, fontWeight: 600 }}>{d}</div>
        ))}
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, minmax(0, 1fr))', gap: 4 }}>
        {cells.map((day, i) => {
          if (day === null) return <div key={i} />;
          const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          const dayBills = billsByDate[iso] || [];
          const isToday = iso === today;
          const inPeriod = iso >= period.start && iso <= period.end;
          return (
            <div key={i} style={{
              minHeight: 56, borderRadius: 8, padding: 4,
              background: isToday ? colors.amberBg : colors.bgElevated,
              border: `1px solid ${inPeriod ? colors.border : colors.borderSoft}`,
              opacity: inPeriod ? 1 : 0.5,
              display: 'flex', flexDirection: 'column', gap: 2,
            }}>
              <div style={{ fontSize: 11, color: isToday ? colors.accent : colors.textMuted, fontWeight: isToday ? 700 : 400 }}>{day}</div>
              {dayBills.slice(0, 2).map(b => (
                <div key={b.id} onClick={() => onSelectBill(b)} style={{
                  fontSize: 9.5, padding: '1px 4px', borderRadius: 4, cursor: 'pointer',
                  background: b.type === 'income' ? colors.blueBg : (isBillPaid(b) ? colors.greenBg : colors.amberBg),
                  color: b.type === 'income' ? colors.blueText : (isBillPaid(b) ? colors.greenText : colors.amber),
                  overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                }} title={`${b.name} · ${formatMoney(b.budgetAmount)}`}>
                  {b.name}
                </div>
              ))}
              {dayBills.length > 2 && <div style={{ fontSize: 9, color: colors.textMuted }}>+{dayBills.length - 2} more</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ============================================================
   HISTORY VIEW (filter by bill, see all occurrences)
   ============================================================ */

function HistoryView({ colors, allBills, settings, onSelectBill }) {
  const [selectedNames, setSelectedNames] = useState([]);
  const [selectedCategories, setSelectedCategories] = useState([]);
  const [pickerOpen, setPickerOpen] = useState(false);
  const [categoryPickerOpen, setCategoryPickerOpen] = useState(false);

  const distinctNames = useMemo(() => {
    const set = new Set(allBills.map(b => b.name));
    return Array.from(set).sort((a, b) => a.localeCompare(b));
  }, [allBills]);

  const distinctCategories = useMemo(() => {
    const set = new Set(allBills.map(b => b.category).filter(Boolean));
    return Array.from(set).sort((a, b) => a.localeCompare(b));
  }, [allBills]);

  function toggleName(name) {
    setSelectedNames(prev => prev.includes(name) ? prev.filter(n => n !== name) : [...prev, name]);
  }

  function toggleCategory(category) {
    setSelectedCategories(prev => prev.includes(category) ? prev.filter(c => c !== category) : [...prev, category]);
  }

  const groups = useMemo(() => {
    const names = selectedNames.length > 0 ? selectedNames : distinctNames;
    return names.map(name => {
      const occurrences = allBills
        .filter(b => b.name === name)
        .filter(b => selectedCategories.length === 0 || selectedCategories.includes(b.category))
        .sort((a, b) => a.dueDate.localeCompare(b.dueDate));

      // For forever-recurring series, trim future unpaid occurrences down to
      // the configured cap. Past and paid occurrences are real history and
      // are never trimmed.
      const today = todayISO();
      const trimmed = [];
      let futureUnpaidShown = 0;
      for (const occ of occurrences) {
        const isForever = occ.seriesId && occ.endType === 'forever';
        const isFutureUnpaid = !isBillPaid(occ) && occ.dueDate >= today;
        if (isForever && isFutureUnpaid) {
          if (futureUnpaidShown >= settings.maxOccurrencesShown) continue;
          futureUnpaidShown++;
        }
        trimmed.push(occ);
      }
      return { name, occurrences: trimmed, totalCount: occurrences.length };
    }).filter(g => g.occurrences.length > 0);
  }, [allBills, selectedNames, distinctNames, selectedCategories, settings.maxOccurrencesShown]);

  if (distinctNames.length === 0) {
    return (
      <div style={{ textAlign: 'center', padding: '60px 20px', color: colors.textMuted }}>
        <ReceiptOffIcon size={36} style={{ display: 'block', margin: '0 auto 10px' }} />
        <div style={{ fontSize: 15 }}>No bills yet</div>
        <div style={{ fontSize: 13, marginTop: 4 }}>Tap Add to add one</div>
      </div>
    );
  }

  return (
    <div style={{ paddingTop: 4, paddingBottom: 8 }}>
      <div style={{ position: 'relative', marginBottom: 16 }}>
        <button
          onClick={() => setPickerOpen(o => !o)}
          style={{
            width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            padding: '11px 14px', borderRadius: 12, border: `1px solid ${colors.border}`,
            background: colors.bgElevated, color: colors.text, cursor: 'pointer', fontSize: 14,
          }}
        >
          <span>
            {selectedNames.length === 0
              ? 'All bills'
              : selectedNames.length === 1
                ? selectedNames[0]
                : `${selectedNames.length} bills selected`}
          </span>
          <ChevronDownIcon size={16} style={{ transform: pickerOpen ? 'rotate(180deg)' : 'none', transition: 'transform 0.15s' }} />
        </button>

        {pickerOpen && (
          <div style={{
            position: 'absolute', top: '110%', left: 0, right: 0, zIndex: 30,
            background: colors.bgElevated, border: `1px solid ${colors.border}`, borderRadius: 12,
            boxShadow: '0 8px 24px rgba(0,0,0,0.18)', maxHeight: 280, overflowY: 'auto', padding: 6,
          }}>
            <button
              onClick={() => setSelectedNames([])}
              style={{
                width: '100%', textAlign: 'left', padding: '9px 10px', borderRadius: 8, border: 'none',
                background: selectedNames.length === 0 ? colors.amberBg : 'transparent', color: colors.text,
                cursor: 'pointer', fontSize: 13.5, fontWeight: selectedNames.length === 0 ? 600 : 400, marginBottom: 2,
              }}
            >
              All bills
            </button>
            {distinctNames.map(name => {
              const checked = selectedNames.includes(name);
              return (
                <button
                  key={name}
                  onClick={() => toggleName(name)}
                  style={{
                    width: '100%', display: 'flex', alignItems: 'center', gap: 8, textAlign: 'left',
                    padding: '9px 10px', borderRadius: 8, border: 'none',
                    background: checked ? colors.amberBg : 'transparent', color: colors.text,
                    cursor: 'pointer', fontSize: 13.5,
                  }}
                >
                  <span style={{
                    width: 16, height: 16, borderRadius: 4, flexShrink: 0,
                    border: `1.5px solid ${checked ? colors.accent : colors.border}`,
                    background: checked ? colors.accent : 'transparent',
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                  }}>
                    {checked && <CheckIcon size={11} style={{ color: colors.accentText }} />}
                  </span>
                  {name}
                </button>
              );
            })}
          </div>
        )}
      </div>

      <div style={{ position: 'relative', marginBottom: 16 }}>
        <button
          onClick={() => setCategoryPickerOpen(o => !o)}
          style={{
            width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            padding: '11px 14px', borderRadius: 12, border: `1px solid ${colors.border}`,
            background: colors.bgElevated, color: colors.text, cursor: 'pointer', fontSize: 14,
          }}
        >
          <span>
            {selectedCategories.length === 0
              ? 'All categories'
              : selectedCategories.length === 1
                ? selectedCategories[0]
                : `${selectedCategories.length} categories selected`}
          </span>
          <ChevronDownIcon size={16} style={{ transform: categoryPickerOpen ? 'rotate(180deg)' : 'none', transition: 'transform 0.15s' }} />
        </button>

        {categoryPickerOpen && (
          <div style={{
            position: 'absolute', top: '110%', left: 0, right: 0, zIndex: 30,
            background: colors.bgElevated, border: `1px solid ${colors.border}`, borderRadius: 12,
            boxShadow: '0 8px 24px rgba(0,0,0,0.18)', maxHeight: 280, overflowY: 'auto', padding: 6,
          }}>
            <button
              onClick={() => setSelectedCategories([])}
              style={{
                width: '100%', textAlign: 'left', padding: '9px 10px', borderRadius: 8, border: 'none',
                background: selectedCategories.length === 0 ? colors.amberBg : 'transparent', color: colors.text,
                cursor: 'pointer', fontSize: 13.5, fontWeight: selectedCategories.length === 0 ? 600 : 400, marginBottom: 2,
              }}
            >
              All categories
            </button>
            {distinctCategories.map(category => {
              const checked = selectedCategories.includes(category);
              return (
                <button
                  key={category}
                  onClick={() => toggleCategory(category)}
                  style={{
                    width: '100%', display: 'flex', alignItems: 'center', gap: 8, textAlign: 'left',
                    padding: '9px 10px', borderRadius: 8, border: 'none',
                    background: checked ? colors.amberBg : 'transparent', color: colors.text,
                    cursor: 'pointer', fontSize: 13.5,
                  }}
                >
                  <span style={{
                    width: 16, height: 16, borderRadius: 4, flexShrink: 0,
                    border: `1.5px solid ${checked ? colors.accent : colors.border}`,
                    background: checked ? colors.accent : 'transparent',
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                  }}>
                    {checked && <CheckIcon size={11} style={{ color: colors.accentText }} />}
                  </span>
                  {category}
                </button>
              );
            })}
          </div>
        )}
      </div>

      {groups.length === 0 && (
        <div style={{ textAlign: 'center', padding: '50px 20px', color: colors.textMuted }}>
          <ReceiptOffIcon size={32} style={{ display: 'block', margin: '0 auto 10px' }} />
          <div style={{ fontSize: 14.5 }}>No bills match these filters</div>
          <div style={{ fontSize: 13, marginTop: 4 }}>Try a different name or category</div>
        </div>
      )}

      <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
        {groups.map(group => {
          const groupIsIncome = group.occurrences[0] && group.occurrences[0].type === 'income';
          return (
          <div key={group.name} style={{ border: `1px solid ${colors.borderSoft}`, borderRadius: 14, overflow: 'hidden' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 14px', background: colors.bgElevated, borderBottom: `1px solid ${colors.borderSoft}` }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <span style={{ fontSize: 14, fontWeight: 600 }}>{group.name}</span>
                <span style={{
                  fontSize: 10, fontWeight: 600, padding: '2px 7px', borderRadius: 5, textTransform: 'uppercase', letterSpacing: 0.3,
                  background: groupIsIncome ? colors.blueBg : colors.amberBg,
                  color: groupIsIncome ? colors.blueText : colors.amber,
                }}>
                  {groupIsIncome ? 'Income' : 'Bill'}
                </span>
              </div>
              <span style={{ fontSize: 11.5, color: colors.textFaint }}>
                {group.occurrences.length}{group.totalCount > group.occurrences.length ? ` of ${group.totalCount}` : ''} shown
              </span>
            </div>
            <table style={{ width: '100%', borderCollapse: 'collapse', tableLayout: 'fixed' }}>
              <thead>
                <tr>
                  <th style={{ width: '40%', textAlign: 'left', padding: '8px 14px', fontSize: 11, fontWeight: 600, color: colors.textMuted, textTransform: 'uppercase', letterSpacing: 0.3 }}>{groupIsIncome ? 'Pay date' : 'Due date'}</th>
                  <th style={{ width: '30%', textAlign: 'right', padding: '8px 14px', fontSize: 11, fontWeight: 600, color: colors.textMuted, textTransform: 'uppercase', letterSpacing: 0.3 }}>Amount</th>
                  <th style={{ width: '30%', textAlign: 'right', padding: '8px 14px', fontSize: 11, fontWeight: 600, color: colors.textMuted, textTransform: 'uppercase', letterSpacing: 0.3 }}>Status</th>
                </tr>
              </thead>
              <tbody>
                {group.occurrences.map((occ, idx) => {
                  const paidStatus = isBillPaid(occ);
                  const overdue = !paidStatus && daysUntil(occ.dueDate) < 0;
                  const statusLabel = paidStatus ? (groupIsIncome ? 'Received' : 'Paid') : overdue ? (groupIsIncome ? 'Not received' : 'Overdue') : 'Upcoming';
                  return (
                    <tr
                      key={occ.id}
                      onClick={() => onSelectBill(occ)}
                      style={{ cursor: 'pointer', borderTop: idx === 0 ? 'none' : `1px solid ${colors.borderSoft}` }}
                    >
                      <td style={{ padding: '9px 14px', fontSize: 13 }}>{formatDateWithYear(occ.dueDate)}</td>
                      <td style={{ padding: '9px 14px', fontSize: 13, textAlign: 'right' }}>{formatMoney(occ.budgetAmount)}</td>
                      <td style={{ padding: '9px 14px', fontSize: 12, textAlign: 'right', fontWeight: 500, color: paidStatus ? colors.green : overdue ? colors.red : colors.amber }}>
                        {statusLabel}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          );
        })}
      </div>
    </div>
  );
}

/* ============================================================
   MODAL SHELL + SHARED STYLES
   ============================================================ */

function ModalShell({ colors, onClose, children, title }) {
  return (
    <div className="modal-anim" onClick={onClose} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.45)', zIndex: 100, display: 'flex', alignItems: 'flex-end', justifyContent: 'center' }}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: colors.bgElevated, width: '100%', maxWidth: 480, borderRadius: '20px 20px 0 0', padding: '20px 20px 28px', maxHeight: '88vh', overflowY: 'auto', border: `1px solid ${colors.border}`, borderBottom: 'none' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
          <div style={{ fontSize: 17, fontWeight: 600 }}>{title}</div>
          <button onClick={onClose} aria-label="Close" style={{ border: 'none', background: colors.borderSoft, color: colors.text, width: 30, height: 30, borderRadius: 8, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <CloseIcon size={16} />
          </button>
        </div>
        {children}
      </div>
    </div>
  );
}

function FieldLabel({ colors, children }) {
  return <label style={{ display: 'block', fontSize: 12.5, color: colors.textMuted, marginBottom: 6, fontWeight: 500 }}>{children}</label>;
}

function inputStyle(colors) {
  return { width: '100%', padding: '10px 12px', borderRadius: 10, border: `1px solid ${colors.border}`, background: colors.bgInput, color: colors.text, fontSize: 15, outline: 'none' };
}

function primaryButtonStyle(colors) {
  return { width: '100%', padding: '13px', borderRadius: 12, border: 'none', background: colors.accent, color: colors.accentText, fontSize: 15, fontWeight: 600, cursor: 'pointer' };
}

function secondaryButtonStyle(colors) {
  return { width: '100%', padding: '13px', borderRadius: 12, border: `1px solid ${colors.border}`, background: 'transparent', color: colors.text, fontSize: 15, fontWeight: 500, cursor: 'pointer' };
}

/* ============================================================
   ADD / EDIT BILL MODAL
   ============================================================ */

function BillEditModal({ colors, bill, onClose, onSaveOccurrence, onSaveAll, onSaveNew, onSaveNewSeries, onRequestDelete }) {
  const isEditingExisting = !!bill;
  const isPartOfSeries = !!(bill && bill.seriesId);

  const [type, setType] = useState(bill ? (bill.type || 'bill') : 'bill');
  const isIncome = type === 'income';
  const categoryOptions = isIncome ? INCOME_CATEGORIES : DEFAULT_CATEGORIES;

  const [name, setName] = useState(bill ? bill.name : '');
  const [category, setCategory] = useState(bill ? bill.category : DEFAULT_CATEGORIES[0]);
  const [budgetAmount, setBudgetAmount] = useState(bill ? String(bill.budgetAmount) : '');
  const [dueDate, setDueDate] = useState(bill ? bill.dueDate : todayISO());
  const [recurring, setRecurring] = useState(bill ? !!bill.seriesId : false);
  const [notes, setNotes] = useState(bill ? bill.notes : '');
  const [paidAmount, setPaidAmount] = useState(bill ? String(bill.paidAmount) : '0');
  const [autoPay, setAutoPay] = useState(bill ? !!bill.autoPay : false);
  const [frequency, setFrequency] = useState(bill && bill.frequency ? bill.frequency : 'monthly');
  const [endType, setEndType] = useState(bill && bill.endType ? bill.endType : 'forever');
  const [occurrenceLimit, setOccurrenceLimit] = useState(bill && bill.occurrenceLimit ? String(bill.occurrenceLimit) : '12');

  const newBudgetNum = parseFloat(budgetAmount) || 0;
  const newPaidNum = parseFloat(paidAmount) || 0;
  const willBePaid = newBudgetNum > 0 && newPaidNum >= newBudgetNum;
  const occurrenceLimitNum = Math.max(1, parseInt(occurrenceLimit) || 1);

  function handleTypeChange(newType) {
    setType(newType);
    // Switching type resets category to a sensible default for that type,
    // since bill and income categories are different lists.
    if (!isEditingExisting) {
      setCategory(newType === 'income' ? INCOME_CATEGORIES[0] : DEFAULT_CATEGORIES[0]);
    }
  }

  function buildOccurrenceFields() {
    return {
      type,
      name: name.trim(),
      category,
      budgetAmount: newBudgetNum,
      paidAmount: newPaidNum,
      dueDate,
      isPaid: willBePaid,
      notes,
      autoPay,
    };
  }

  function handleSaveNew() {
    if (!name.trim() || !budgetAmount) return;
    if (recurring) {
      const template = {
        type,
        seriesId: uid(),
        name: name.trim(),
        category,
        budgetAmount: newBudgetNum,
        notes,
        frequency,
        seriesStartDate: dueDate,
        endType,
        occurrenceLimit: endType === 'count' ? occurrenceLimitNum : null,
        autoPay,
      };
      const totalAllowed = endType === 'forever' ? FOREVER_GENERATION_WINDOW : Math.min(occurrenceLimitNum, FOREVER_GENERATION_WINDOW);
      onSaveNewSeries(template, totalAllowed);
    } else {
      onSaveNew({ id: uid(), ...buildOccurrenceFields(), recurring: false, seriesId: null, occurrenceIndex: null, frequency: null, seriesStartDate: null, endType: null, occurrenceLimit: null });
    }
  }

  function handleSaveOccurrence() {
    if (!name.trim() || !budgetAmount) return;
    onSaveOccurrence({ id: bill.id, ...buildOccurrenceFields() });
  }

  function handleSaveAll() {
    if (!name.trim() || !budgetAmount) return;
    const updated = {
      ...buildOccurrenceFields(),
      frequency,
      seriesStartDate: bill.seriesStartDate || dueDate,
      endType,
      occurrenceLimit: endType === 'count' ? occurrenceLimitNum : null,
    };
    onSaveAll(updated, bill);
  }

  const showSeriesFields = recurring && (!isEditingExisting || isPartOfSeries);

  return (
    <ModalShell colors={colors} onClose={onClose} title={isEditingExisting ? (isIncome ? 'Edit income' : 'Edit bill') : (isIncome ? 'Add income' : 'Add bill')}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
        {!isEditingExisting && (
          <div style={{ display: 'flex', gap: 8 }}>
            {[{ key: 'bill', label: 'Bill' }, { key: 'income', label: 'Income' }].map(t => (
              <button
                type="button"
                key={t.key}
                onClick={() => handleTypeChange(t.key)}
                style={{
                  flex: 1, padding: '10px', borderRadius: 10, cursor: 'pointer',
                  border: `1px solid ${type === t.key ? colors.accent : colors.border}`,
                  background: type === t.key ? colors.accent : 'transparent',
                  color: type === t.key ? colors.accentText : colors.text,
                  fontSize: 14, fontWeight: 500,
                }}
              >
                {t.label}
              </button>
            ))}
          </div>
        )}
        <div>
          <FieldLabel colors={colors}>{isIncome ? 'Income name' : 'Bill name'}</FieldLabel>
          <input style={inputStyle(colors)} value={name} onChange={e => setName(e.target.value)} placeholder={isIncome ? 'e.g. Paycheck' : 'e.g. Rent'} />
        </div>
        <div>
          <FieldLabel colors={colors}>Category</FieldLabel>
          <select style={inputStyle(colors)} value={category} onChange={e => setCategory(e.target.value)}>
            {categoryOptions.map(c => <option key={c} value={c}>{c}</option>)}
          </select>
        </div>
        <div style={{ display: 'flex', gap: 12 }}>
          <div style={{ flex: 1 }}>
            <FieldLabel colors={colors}>{isIncome ? 'Amount' : 'Budget amount'}</FieldLabel>
            <input style={inputStyle(colors)} type="number" step="0.01" value={budgetAmount} onChange={e => setBudgetAmount(e.target.value)} placeholder="0.00" />
          </div>
          <div style={{ flex: 1 }}>
            <FieldLabel colors={colors}>{isIncome ? 'Pay date' : 'Due date'}</FieldLabel>
            <input style={inputStyle(colors)} type="date" value={dueDate} onChange={e => setDueDate(e.target.value)} />
          </div>
        </div>
        <div>
          <FieldLabel colors={colors}>Notes (optional)</FieldLabel>
          <input style={inputStyle(colors)} value={notes} onChange={e => setNotes(e.target.value)} placeholder={isIncome ? 'Employer, account, etc.' : 'Account number, etc.'} />
        </div>
        {isEditingExisting && (
          <div>
            <FieldLabel colors={colors}>{isIncome ? 'Amount received so far' : 'Amount paid so far'}</FieldLabel>
            <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
              <input style={{ ...inputStyle(colors), flex: 1 }} type="number" step="0.01" value={paidAmount} onChange={e => setPaidAmount(e.target.value)} placeholder="0.00" />
              <button
                type="button"
                onClick={() => setPaidAmount(budgetAmount || '0')}
                style={{ ...secondaryButtonStyle(colors), width: 'auto', padding: '10px 12px', fontSize: 13, whiteSpace: 'nowrap' }}
              >
                Mark full
              </button>
            </div>
            <div style={{ fontSize: 12, marginTop: 6, color: willBePaid ? colors.green : colors.textMuted, fontWeight: 500 }}>
              {isIncome
                ? (willBePaid ? 'Received in full — counted toward this period\u2019s income' : `${formatMoney(Math.max(0, newBudgetNum - newPaidNum))} not yet received`)
                : (willBePaid ? 'Paid in full — will show in the Paid section' : `${formatMoney(Math.max(0, newBudgetNum - newPaidNum))} remaining — will show as upcoming or overdue`)}
            </div>
          </div>
        )}

        <label style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 14, color: colors.text, cursor: 'pointer' }}>
          <input type="checkbox" checked={autoPay} onChange={e => setAutoPay(e.target.checked)} />
          {isIncome ? 'Auto-receive on pay date' : 'Auto-pay on due date'}
          <span style={{ fontSize: 11.5, color: colors.textFaint }}>{isIncome ? '(marks received in full automatically)' : '(marks paid in full automatically)'}</span>
        </label>

        {!isPartOfSeries && (
          <label style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 14, color: colors.text, cursor: isEditingExisting ? 'default' : 'pointer', opacity: isEditingExisting ? 0.6 : 1 }}>
            <input type="checkbox" checked={recurring} disabled={isEditingExisting} onChange={e => setRecurring(e.target.checked)} />
            {isIncome ? 'Recurring income' : 'Recurring bill'}
            {isEditingExisting && <span style={{ fontSize: 11.5, color: colors.textFaint }}>(set when first created)</span>}
          </label>
        )}
        {isPartOfSeries && (
          <div style={{ fontSize: 12.5, color: colors.textMuted, display: 'flex', alignItems: 'center', gap: 6 }}>
            <ClockIcon size={13} />
            Part of a recurring series — choose how to save below
          </div>
        )}

        {showSeriesFields && (
          <div style={{ border: `1px solid ${colors.borderSoft}`, borderRadius: 12, padding: 12, display: 'flex', flexDirection: 'column', gap: 12 }}>
            <div>
              <FieldLabel colors={colors}>Frequency</FieldLabel>
              <select style={inputStyle(colors)} value={frequency} onChange={e => setFrequency(e.target.value)}>
                {FREQUENCIES.map(f => <option key={f} value={f}>{FREQUENCY_LABELS[f]}</option>)}
              </select>
            </div>
            <div>
              <FieldLabel colors={colors}>Repeats</FieldLabel>
              <div style={{ display: 'flex', gap: 8, marginBottom: endType === 'count' ? 10 : 0 }}>
                {['forever', 'count'].map(t => (
                  <button
                    type="button"
                    key={t}
                    onClick={() => setEndType(t)}
                    style={{
                      flex: 1, padding: '10px', borderRadius: 10, cursor: 'pointer',
                      border: `1px solid ${endType === t ? colors.accent : colors.border}`,
                      background: endType === t ? colors.accent : 'transparent',
                      color: endType === t ? colors.accentText : colors.text,
                      fontSize: 13, fontWeight: 500,
                    }}
                  >
                    {t === 'forever' ? 'Forever' : 'Set number of times'}
                  </button>
                ))}
              </div>
              {endType === 'count' && (
                <div>
                  <input
                    style={inputStyle(colors)}
                    type="number"
                    min="1"
                    value={occurrenceLimit}
                    onChange={e => setOccurrenceLimit(e.target.value)}
                    placeholder="e.g. 6"
                  />
                  <div style={{ fontSize: 11.5, color: colors.textFaint, marginTop: 6 }}>
                    Occurs {occurrenceLimitNum} time{occurrenceLimitNum === 1 ? '' : 's'} total, {FREQUENCY_LABELS[frequency].toLowerCase()}, starting {formatDateShort(dueDate)}.
                  </div>
                </div>
              )}
            </div>
          </div>
        )}

        {!isEditingExisting && (
          <button style={primaryButtonStyle(colors)} onClick={handleSaveNew}>Add bill</button>
        )}

        {isEditingExisting && !isPartOfSeries && (
          <>
            <button style={primaryButtonStyle(colors)} onClick={handleSaveOccurrence}>Save changes</button>
            {onRequestDelete && (
              <button style={{ ...secondaryButtonStyle(colors), color: colors.red, borderColor: colors.red, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6 }} onClick={() => onRequestDelete(bill, 'occurrence')}>
                <TrashIcon size={15} />
                Delete bill
              </button>
            )}
          </>
        )}

        {isEditingExisting && isPartOfSeries && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            <div style={{ display: 'flex', gap: 8 }}>
              <button style={{ ...primaryButtonStyle(colors), flex: 1, fontSize: 13.5 }} onClick={handleSaveOccurrence}>
                Save this occurrence
              </button>
              <button style={{ ...primaryButtonStyle(colors), flex: 1, fontSize: 13.5 }} onClick={handleSaveAll}>
                Save this &amp; future
              </button>
            </div>
            <div style={{ fontSize: 11, color: colors.textFaint, lineHeight: 1.4, padding: '0 2px' }}>
              "This occurrence" only changes the bill on {formatDateShort(bill.dueDate)}. "This &amp; future" updates every unpaid occurrence, past or future — paid ones are kept as history.
            </div>
            {onRequestDelete && (
              <div style={{ display: 'flex', gap: 8, marginTop: 4 }}>
                <button style={{ ...secondaryButtonStyle(colors), flex: 1, color: colors.red, borderColor: colors.red, fontSize: 13.5, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6 }} onClick={() => onRequestDelete(bill, 'occurrence')}>
                  <TrashIcon size={14} />
                  Delete occurrence
                </button>
                <button style={{ ...secondaryButtonStyle(colors), flex: 1, color: colors.red, borderColor: colors.red, fontSize: 13.5, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6 }} onClick={() => onRequestDelete(bill, 'all')}>
                  <TrashIcon size={14} />
                  Delete all
                </button>
              </div>
            )}
          </div>
        )}
      </div>
    </ModalShell>
  );
}

/* ============================================================
   PARTIAL PAYMENT MODAL
   ============================================================ */

function PartialPaymentModal({ colors, bill, onClose, onConfirm }) {
  const isIncome = bill.type === 'income';
  const remaining = bill.budgetAmount - bill.paidAmount;
  const [amount, setAmount] = useState(remaining > 0 ? String(remaining.toFixed(2)) : '');

  return (
    <ModalShell colors={colors} onClose={onClose} title={isIncome ? `Log received \u00b7 ${bill.name}` : `Log payment \u00b7 ${bill.name}`}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
        <div style={{ fontSize: 13, color: colors.textMuted }}>
          {isIncome
            ? `${formatMoney(bill.paidAmount)} already received of ${formatMoney(bill.budgetAmount)} expected. Remaining: ${formatMoney(Math.max(0, remaining))}`
            : `${formatMoney(bill.paidAmount)} already paid of ${formatMoney(bill.budgetAmount)} budgeted. Remaining: ${formatMoney(Math.max(0, remaining))}`}
        </div>
        <div>
          <FieldLabel colors={colors}>{isIncome ? 'Amount received now' : 'Amount paid now'}</FieldLabel>
          <input style={inputStyle(colors)} type="number" step="0.01" autoFocus value={amount} onChange={e => setAmount(e.target.value)} placeholder="0.00" />
        </div>
        <button style={primaryButtonStyle(colors)} onClick={() => { const n = parseFloat(amount); if (!isNaN(n) && n > 0) onConfirm(n); }}>{isIncome ? 'Log received' : 'Log payment'}</button>
        <button style={secondaryButtonStyle(colors)} onClick={onClose}>Cancel</button>
      </div>
    </ModalShell>
  );
}

/* ============================================================
   EDIT BUDGET MODAL
   ============================================================ */

function EditBudgetModal({ colors, bill, onClose, onConfirm }) {
  const isIncome = bill.type === 'income';
  const [amount, setAmount] = useState(String(bill.budgetAmount));
  return (
    <ModalShell colors={colors} onClose={onClose} title={isIncome ? `Edit amount \u00b7 ${bill.name}` : `Edit budget \u00b7 ${bill.name}`}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
        <div>
          <FieldLabel colors={colors}>{isIncome ? 'New amount' : 'New budget amount'}</FieldLabel>
          <input style={inputStyle(colors)} type="number" step="0.01" autoFocus value={amount} onChange={e => setAmount(e.target.value)} />
        </div>
        <button style={primaryButtonStyle(colors)} onClick={() => { const n = parseFloat(amount); if (!isNaN(n) && n >= 0) onConfirm(n); }}>{isIncome ? 'Save amount' : 'Save budget'}</button>
        <button style={secondaryButtonStyle(colors)} onClick={onClose}>Cancel</button>
      </div>
    </ModalShell>
  );
}

/* ============================================================
   CONFIRM MODAL
   ============================================================ */

function ConfirmModal({ colors, title, message, confirmLabel, danger, onCancel, onConfirm }) {
  return (
    <ModalShell colors={colors} onClose={onCancel} title={title}>
      <div style={{ fontSize: 14, color: colors.textMuted, marginBottom: 18 }}>{message}</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        <button style={{ ...primaryButtonStyle(colors), background: danger ? colors.red : colors.accent, color: '#fff' }} onClick={onConfirm}>{confirmLabel}</button>
        <button style={secondaryButtonStyle(colors)} onClick={onCancel}>Cancel</button>
      </div>
    </ModalShell>
  );
}

/* ============================================================
   SETTINGS MODAL
   ============================================================ */

function SyncSection({ colors, settings, update, syncStatus, syncError }) {
  const [urlDraft, setUrlDraft] = useState(settings.syncUrl);
  const [keyDraft, setKeyDraft] = useState(settings.syncKey);
  const [testState, setTestState] = useState('idle'); // idle | testing | ok | fail
  const [testMessage, setTestMessage] = useState('');

  const isConfigured = syncConfigured(settings);

  async function handleSaveConnection() {
    setTestState('testing');
    setTestMessage('');
    const trial = { ...settings, syncUrl: urlDraft, syncKey: keyDraft };
    try {
      await syncTestConnection(trial);
      setTestState('ok');
      update({ syncUrl: urlDraft.trim(), syncKey: keyDraft });
    } catch (err) {
      setTestState('fail');
      setTestMessage(err.message || 'Could not connect.');
    }
  }

  function handleDisconnect() {
    update({ syncUrl: '', syncKey: '' });
    setUrlDraft('');
    setKeyDraft('');
    setTestState('idle');
    setTestMessage('');
  }

  const statusBadge = (() => {
    if (!isConfigured) return null;
    if (syncStatus === 'syncing') return { label: 'Syncing…', color: colors.amber };
    if (syncStatus === 'synced') return { label: 'Synced', color: colors.green };
    if (syncStatus === 'offline') return { label: 'Offline — using local data', color: colors.textMuted };
    if (syncStatus === 'error') return { label: 'Sync error', color: colors.red };
    return null;
  })();

  return (
    <Section colors={colors} title="Sync across devices">
      {isConfigured ? (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '10px 12px', borderRadius: 10, border: `1px solid ${colors.border}`, background: colors.bgInput }}>
            <CloudIcon size={15} style={{ color: colors.textMuted, flexShrink: 0 }} />
            <div style={{ minWidth: 0, flex: 1 }}>
              <div style={{ fontSize: 13, fontWeight: 500, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{settings.syncUrl}</div>
              {statusBadge && <div style={{ fontSize: 11.5, color: statusBadge.color, marginTop: 1 }}>{statusBadge.label}</div>}
            </div>
          </div>
          {syncStatus === 'error' && syncError && (
            <div style={{ fontSize: 11.5, color: colors.red }}>{syncError}</div>
          )}
          <button style={{ ...secondaryButtonStyle(colors), color: colors.red, borderColor: colors.red }} onClick={handleDisconnect}>
            Disconnect
          </button>
        </div>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          <div style={{ fontSize: 11.5, color: colors.textFaint, lineHeight: 1.5 }}>
            Connect to your self-hosted server to keep bills in sync across your phone and PC. Without this, bills stay local to this device only.
          </div>
          <div>
            <FieldLabel colors={colors}>Server address</FieldLabel>
            <input
              style={inputStyle(colors)}
              value={urlDraft}
              onChange={e => setUrlDraft(e.target.value)}
              placeholder="http://100.x.x.x:3001"
            />
          </div>
          <div>
            <FieldLabel colors={colors}>App key</FieldLabel>
            <input
              style={inputStyle(colors)}
              type="password"
              value={keyDraft}
              onChange={e => setKeyDraft(e.target.value)}
              placeholder="The key set on your server"
            />
          </div>
          {testState === 'fail' && (
            <div style={{ fontSize: 11.5, color: colors.red }}>{testMessage}</div>
          )}
          {testState === 'ok' && (
            <div style={{ fontSize: 11.5, color: colors.green }}>Connected.</div>
          )}
          <button
            style={primaryButtonStyle(colors)}
            onClick={handleSaveConnection}
            disabled={!urlDraft.trim() || !keyDraft || testState === 'testing'}
          >
            {testState === 'testing' ? 'Connecting…' : 'Connect'}
          </button>
        </div>
      )}
    </Section>
  );
}

function SettingsModal({ colors, settings, setSettings, onClose, onExportCSV, onExportJSON, onImportClick, onGoogleDrive, onClearAll, syncStatus, syncError }) {
  function update(patch) {
    setSettings(s => ({ ...s, ...patch }));
  }

  return (
    <ModalShell colors={colors} onClose={onClose} title="Settings">
      <div style={{ display: 'flex', flexDirection: 'column', gap: 22 }}>

        <SyncSection colors={colors} settings={settings} update={update} syncStatus={syncStatus} syncError={syncError} />

        <Section colors={colors} title="Appearance">
          <div style={{ display: 'flex', gap: 8 }}>
            {['light', 'dark'].map(t => (
              <button key={t} onClick={() => update({ theme: t })} style={{
                flex: 1, padding: '10px', borderRadius: 10, cursor: 'pointer',
                border: `1px solid ${settings.theme === t ? colors.accent : colors.border}`,
                background: settings.theme === t ? colors.accent : 'transparent',
                color: settings.theme === t ? colors.accentText : colors.text,
                fontSize: 14, fontWeight: 500, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6,
              }}>
                {t === 'light' ? <SunIcon size={15} /> : <MoonIcon size={15} />}
                {t === 'light' ? 'Light' : 'Dark'}
              </button>
            ))}
          </div>
        </Section>

        <Section colors={colors} title="Budget period">
          <div style={{ display: 'flex', gap: 8, marginBottom: settings.periodMode === 'biweekly' ? 12 : 0 }}>
            {['monthly', 'biweekly'].map(p => (
              <button key={p} onClick={() => update({ periodMode: p })} style={{
                flex: 1, padding: '10px', borderRadius: 10, cursor: 'pointer',
                border: `1px solid ${settings.periodMode === p ? colors.accent : colors.border}`,
                background: settings.periodMode === p ? colors.accent : 'transparent',
                color: settings.periodMode === p ? colors.accentText : colors.text,
                fontSize: 14, fontWeight: 500,
              }}>
                {p === 'monthly' ? 'Monthly' : 'Biweekly'}
              </button>
            ))}
          </div>
          {settings.periodMode === 'biweekly' && (
            <div>
              <FieldLabel colors={colors}>Pay day (period starts on this weekday)</FieldLabel>
              <select style={inputStyle(colors)} value={settings.biweeklyAnchorDay} onChange={e => {
                const day = parseInt(e.target.value);
                update({ biweeklyAnchorDay: day, biweeklyAnchorDate: nextAnchorOnOrAfter(todayISO(), day) });
              }}>
                {DAY_NAMES.map((d, i) => <option key={i} value={i}>{d}</option>)}
              </select>
              <div style={{ fontSize: 12, color: colors.textMuted, marginTop: 6 }}>
                Each period runs {DAY_NAMES[settings.biweeklyAnchorDay]} through the {DAY_NAMES[(settings.biweeklyAnchorDay + 6) % 7]} two weeks later.
              </div>
            </div>
          )}
        </Section>

        <Section colors={colors} title="Bill history view">
          <FieldLabel colors={colors}>Max occurrences shown per bill (forever-recurring bills)</FieldLabel>
          <input
            style={inputStyle(colors)}
            type="number"
            min="1"
            max="20"
            value={settings.maxOccurrencesShown}
            onChange={e => {
              const n = Math.max(1, Math.min(20, parseInt(e.target.value) || 1));
              update({ maxOccurrencesShown: n });
            }}
          />
          <div style={{ fontSize: 11.5, color: colors.textFaint, marginTop: 6 }}>
            Caps how many upcoming occurrences show per bill in the bill history view. Max 20.
          </div>
        </Section>

        <Section colors={colors} title="Swipe actions">
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
            <div>
              <FieldLabel colors={colors}>Swipe right</FieldLabel>
              <select style={inputStyle(colors)} value={settings.swipeRight} onChange={e => update({ swipeRight: e.target.value })}>
                {Object.entries(ACTION_LABELS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
              </select>
            </div>
            <div>
              <FieldLabel colors={colors}>Swipe left</FieldLabel>
              <select style={inputStyle(colors)} value={settings.swipeLeft} onChange={e => update({ swipeLeft: e.target.value })}>
                {Object.entries(ACTION_LABELS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
              </select>
            </div>
          </div>
        </Section>

        <Section colors={colors} title="Data">
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            <button style={{ ...secondaryButtonStyle(colors), display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6 }} onClick={onGoogleDrive}>
              <CloudIcon size={15} />
              Connect Google Drive
            </button>
            <div style={{ display: 'flex', gap: 8 }}>
              <button style={{ ...secondaryButtonStyle(colors), flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6 }} onClick={onExportCSV}>
                <DownloadIcon size={15} />
                Export CSV
              </button>
              <button style={{ ...secondaryButtonStyle(colors), flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6 }} onClick={onExportJSON}>
                <DownloadIcon size={15} />
                Export JSON
              </button>
            </div>
            <button style={{ ...secondaryButtonStyle(colors), display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6 }} onClick={onImportClick}>
              <UploadIcon size={15} />
              Import from file
            </button>
            <div style={{ fontSize: 11.5, color: colors.textFaint, lineHeight: 1.5 }}>
              Import accepts the same CSV or JSON format produced by export, so a fresh phone or browser can be restored in one tap. Bills and income are both included. "Forever" recurring entries export as their history plus one marker row, then regenerate their upcoming occurrences automatically on import — so the file never balloons with endless future rows.
            </div>
          </div>
        </Section>

        <Section colors={colors} title="Reset">
          <button style={{ ...secondaryButtonStyle(colors), color: colors.red, borderColor: colors.red, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6 }} onClick={onClearAll}>
            <TrashIcon size={15} />
            Clear all bills
          </button>
          <div style={{ fontSize: 11.5, color: colors.textFaint, lineHeight: 1.5, marginTop: 8 }}>
            Removes every bill, including the starter examples. Export first if you want a backup.
          </div>
        </Section>
      </div>
    </ModalShell>
  );
}

function Section({ colors, title, children }) {
  return (
    <div>
      <div style={{ fontSize: 13, fontWeight: 600, color: colors.textMuted, marginBottom: 10, textTransform: 'uppercase', letterSpacing: 0.3 }}>{title}</div>
      {children}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>

<script>
  // Manually transpile and run the app source, forcing the classic JSX
  // runtime explicitly (rather than relying on a default that differs
  // between Babel versions) and surfacing any error visibly instead of
  // a silent blank screen.
  try {
    const source = document.getElementById('app-source').textContent;
    const { code } = Babel.transform(source, {
      presets: [['react', { runtime: 'classic' }]],
    });
    (0, eval)(code);
  } catch (err) {
    const el = document.getElementById('boot-error');
    el.style.display = 'block';
    el.textContent = 'I Got Bills failed to start.\n\n' + (err && err.message ? err.message : String(err));
    console.error(err);
  }
</script>

<script>
  // Register a minimal service worker so the app can be added to the home
  // screen as an installable PWA and keep working offline once loaded.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
