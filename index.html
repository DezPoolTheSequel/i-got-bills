const { useState, useEffect, useMemo, useRef } = React;


/* ============================================================
   APP IDENTITY
   ============================================================ */

// Version format: YY.MM.DD.N — N is a same-day build counter, reset to 1
// whenever the date changes, incremented whenever this file is republished
// again on the same day.
const APP_NAME = 'I Got Bills';
const APP_VERSION = '26.06.21.2';

/* ============================================================
   CONSTANTS / HELPERS
   ============================================================ */

const STORAGE_KEY = 'billsTrackerData_v3';
const SETTINGS_KEY = 'billsTrackerSettings_v3';

const DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

const DEFAULT_CATEGORIES = ['Housing', 'Utilities', 'Subscriptions', 'Insurance', 'Credit Card', 'Debt', 'Other'];
const INCOME_CATEGORIES = ['Paycheck', 'Freelance', 'Gift', 'Refund', 'Other income'];

const ACTION_LABELS = {
  paidFull: 'Mark paid in full',
  paidPartial: 'Log partial payment',
  editBudget: 'Edit budget amount',
  none: 'No action',
};

const ACTION_COLORS = {
  paidFull: '#1D9E75',
  paidPartial: '#378ADD',
  editBudget: '#BA7517',
  none: '#888780',
};

const ACTION_ICON_COMPONENTS = {
  paidFull: CheckIcon,
  paidPartial: CoinIcon,
  editBudget: EditIcon,
  none: CloseIcon,
};

const ACTION_SHORT_LABELS = {
  paidFull: 'Paid',
  paidPartial: 'Partial',
  editBudget: 'Edit',
  none: '',
};

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
}

function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function parseISO(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function toISO(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function formatMoney(n) {
  return (Number(n) || 0).toLocaleString('en-US', { style: 'currency', currency: 'USD' });
}

function formatDateShort(iso) {
  const d = parseISO(iso);
  return `${MONTH_NAMES[d.getMonth()].slice(0, 3)} ${d.getDate()}`;
}

function formatDateWithYear(iso) {
  const d = parseISO(iso);
  return `${MONTH_NAMES[d.getMonth()].slice(0, 3)} ${d.getDate()}, ${d.getFullYear()}`;
}

function daysUntil(iso) {
  const today = parseISO(todayISO());
  const due = parseISO(iso);
  return Math.round((due.getTime() - today.getTime()) / 86400000);
}

// Single source of truth for "is this bill paid" — derived from the actual
// amounts rather than trusting a stored flag, so it can't drift out of sync
// after edits to budget or paid amount.
function isBillPaid(bill) {
  return bill.budgetAmount > 0 && bill.paidAmount >= bill.budgetAmount;
}

function addDays(iso, days) {
  const d = parseISO(iso);
  d.setDate(d.getDate() + days);
  return toISO(d);
}

function getBiweeklyPeriod(targetISO, anchorDate) {
  const anchor = parseISO(anchorDate);
  const target = parseISO(targetISO);
  const diffDays = Math.floor((target.getTime() - anchor.getTime()) / 86400000);
  const periodIndex = Math.floor(diffDays / 14);
  const start = new Date(anchor);
  start.setDate(start.getDate() + periodIndex * 14);
  const end = new Date(start);
  end.setDate(end.getDate() + 13);
  return { start: toISO(start), end: toISO(end) };
}

function nextAnchorOnOrAfter(fromISO, weekday) {
  const d = parseISO(fromISO);
  const diff = (weekday - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + diff);
  return toISO(d);
}

/* ============================================================
   RECURRENCE ENGINE
   ============================================================ */

const FREQUENCIES = ['weekly', 'biweekly', 'monthly', 'annual'];

const FREQUENCY_LABELS = {
  weekly: 'Weekly',
  biweekly: 'Bi-weekly',
  monthly: 'Monthly',
  annual: 'Annual',
};

// How many occurrences (including the first) to materialize into storage at
// a time for a "forever" series. Regenerated/extended as the window is consumed.
const FOREVER_GENERATION_WINDOW = 24;

function advanceDateByFrequency(iso, frequency, steps) {
  const d = parseISO(iso);
  if (frequency === 'weekly') {
    d.setDate(d.getDate() + 7 * steps);
    return toISO(d);
  }
  if (frequency === 'biweekly') {
    d.setDate(d.getDate() + 14 * steps);
    return toISO(d);
  }
  if (frequency === 'monthly') {
    const targetMonthIndex = d.getMonth() + steps;
    const targetYear = d.getFullYear() + Math.floor(targetMonthIndex / 12);
    const targetMonth = ((targetMonthIndex % 12) + 12) % 12;
    const lastDayOfTargetMonth = new Date(targetYear, targetMonth + 1, 0).getDate();
    const clampedDay = Math.min(d.getDate(), lastDayOfTargetMonth);
    return toISO(new Date(targetYear, targetMonth, clampedDay));
  }
  if (frequency === 'annual') {
    const targetYear = d.getFullYear() + steps;
    // Clamp Feb 29 -> Feb 28 on non-leap target years.
    const lastDayOfTargetMonth = new Date(targetYear, d.getMonth() + 1, 0).getDate();
    const clampedDay = Math.min(d.getDate(), lastDayOfTargetMonth);
    return toISO(new Date(targetYear, d.getMonth(), clampedDay));
  }
  return toISO(d);
}

// Given a series template (the shared fields) and how many occurrences to
// produce starting at occurrence index `startIndex` (0-based, relative to
// the series' original start date), return that many new Bill records.
function generateOccurrences(template, startIndex, count) {
  const out = [];
  for (let i = 0; i < count; i++) {
    const occurrenceIndex = startIndex + i;
    const dueDate = advanceDateByFrequency(template.seriesStartDate, template.frequency, occurrenceIndex);
    out.push({
      id: uid(),
      type: template.type || 'bill', // 'bill' | 'income'
      seriesId: template.seriesId,
      occurrenceIndex,
      name: template.name,
      category: template.category,
      budgetAmount: template.budgetAmount,
      paidAmount: 0,
      dueDate,
      isPaid: false,
      notes: template.notes,
      recurring: true,
      autoPay: template.autoPay || false,
      frequency: template.frequency,
      seriesStartDate: template.seriesStartDate,
      endType: template.endType, // 'forever' | 'count'
      occurrenceLimit: template.occurrenceLimit, // null if forever
    });
  }
  return out;
}

// How many occurrences should exist for a bounded ('count') series.
function totalOccurrencesFor(template) {
  if (template.endType === 'forever') return Infinity;
  return Math.max(1, template.occurrenceLimit || 1);
}

/* ============================================================
   STORAGE
   ============================================================ */

function seedDemoData() {
  const today = todayISO();
  const rentSeriesId = uid();
  const rentTemplate = {
    type: 'bill',
    seriesId: rentSeriesId,
    name: 'Rent',
    category: 'Housing',
    budgetAmount: 1450,
    notes: '',
    frequency: 'monthly',
    seriesStartDate: addDays(today, 3),
    endType: 'forever',
    occurrenceLimit: null,
    autoPay: false,
  };
  const rentOccurrences = generateOccurrences(rentTemplate, 0, 6);

  const paycheckSeriesId = uid();
  const paycheckTemplate = {
    type: 'income',
    seriesId: paycheckSeriesId,
    name: 'Paycheck',
    category: 'Paycheck',
    budgetAmount: 1800,
    notes: '',
    frequency: 'biweekly',
    seriesStartDate: nextAnchorOnOrAfter(today, 5),
    endType: 'forever',
    occurrenceLimit: null,
    autoPay: true,
  };
  const paycheckOccurrences = generateOccurrences(paycheckTemplate, 0, 6);

  return [
    ...rentOccurrences,
    ...paycheckOccurrences,
    { id: uid(), type: 'bill', name: 'Power Company', category: 'Utilities', budgetAmount: 145, paidAmount: 0, dueDate: addDays(today, 6), isPaid: false, notes: '', recurring: false, autoPay: false },
    { id: uid(), type: 'bill', name: 'Internet', category: 'Utilities', budgetAmount: 80, paidAmount: 0, dueDate: addDays(today, 10), isPaid: false, notes: '', recurring: false, autoPay: true },
    { id: uid(), type: 'bill', name: 'Spotify', category: 'Subscriptions', budgetAmount: 11.99, paidAmount: 11.99, dueDate: addDays(today, -2), isPaid: true, notes: '', recurring: false, autoPay: true },
    { id: uid(), type: 'bill', name: 'Car Insurance', category: 'Insurance', budgetAmount: 132, paidAmount: 0, dueDate: addDays(today, 14), isPaid: false, notes: '', recurring: false, autoPay: false },
  ];
}

function loadBills() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return seedDemoData();
    const parsed = JSON.parse(raw);
    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
    return seedDemoData();
  } catch {
    return seedDemoData();
  }
}

function saveBills(bills) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(bills)); } catch {}
}

function loadSettings() {
  const defaults = {
    theme: 'light',
    periodMode: 'monthly',
    biweeklyAnchorDay: 5,
    biweeklyAnchorDate: nextAnchorOnOrAfter(todayISO(), 5),
    swipeRight: 'paidFull',
    swipeLeft: 'paidPartial',
    maxOccurrencesShown: 12,
    syncUrl: '',
    syncKey: '',
  };
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (!raw) return defaults;
    return { ...defaults, ...JSON.parse(raw) };
  } catch {
    return defaults;
  }
}

function saveSettings(s) {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); } catch {}
}

/* ============================================================
   SYNC (talks to the self-hosted backend, when configured)
   ============================================================ */

// Strip a trailing slash so we can reliably append /api/... paths.
function normalizeSyncUrl(url) {
  return (url || '').trim().replace(/\/+$/, '');
}

function syncConfigured(settings) {
  return !!(normalizeSyncUrl(settings.syncUrl) && settings.syncKey);
}

async function syncFetch(settings, path, options) {
  const base = normalizeSyncUrl(settings.syncUrl);
  const res = await fetch(base + path, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      'x-app-key': settings.syncKey,
      ...(options && options.headers),
    },
  });
  if (!res.ok) {
    let detail = '';
    try { detail = (await res.json()).error || ''; } catch {}
    throw new Error(detail || `Sync request failed (${res.status})`);
  }
  return res.json();
}

// Quick reachability + auth check, used by the "Test connection" button and
// before attempting a real sync so failures are diagnosable.
async function syncTestConnection(settings) {
  const base = normalizeSyncUrl(settings.syncUrl);
  if (!base) throw new Error('No server address set.');
  const healthRes = await fetch(base + '/api/health');
  if (!healthRes.ok) throw new Error('Server did not respond. Check the address.');
  // Health check passing only proves the server is reachable, not that the
  // key is correct — confirm the key separately against a real endpoint.
  await syncFetch(settings, '/api/bills', { method: 'GET' });
  return true;
}

async function syncPullBills(settings) {
  return syncFetch(settings, '/api/bills', { method: 'GET' });
}

async function syncPushBills(settings, bills) {
  return syncFetch(settings, '/api/bills', { method: 'PUT', body: JSON.stringify(bills) });
}

async function syncPullSettings(settings) {
  return syncFetch(settings, '/api/settings', { method: 'GET' });
}

async function syncPushSettings(settings, settingsToPush) {
  // Never push the connection credentials themselves to the server — only
  // the app-preference fields, so the key isn't duplicated in the stored
  // settings blob server-side.
  const { syncUrl, syncKey, ...rest } = settingsToPush;
  return syncFetch(settings, '/api/settings', { method: 'PUT', body: JSON.stringify(rest) });
}

/* ============================================================
   CSV / IMPORT-EXPORT
   ============================================================ */

const CSV_COLUMNS = ['type', 'name', 'category', 'budgetAmount', 'paidAmount', 'dueDate', 'isPaid', 'notes', 'recurring', 'autoPay', 'seriesId', 'occurrenceIndex', 'frequency', 'seriesStartDate', 'endType', 'occurrenceLimit'];

// For "forever" series, exporting every generated future occurrence is both
// wasteful and fragile (the cache window is just an implementation detail,
// not real data). Instead, keep every real record — anything paid, or due
// in the past — in full, and collapse the future/unpaid tail of each
// forever series down to a single placeholder row. The importer recognizes
// that placeholder (isSeriesPlaceholder) and regenerates the forward window
// from it, the same way the app does internally.
function collapseForExport(bills) {
  const today = todayISO();
  const bySeriesForever = new Map();

  for (const b of bills) {
    if (b.seriesId && b.endType === 'forever') {
      const isFutureUnpaid = !isBillPaid(b) && b.dueDate >= today;
      if (isFutureUnpaid) {
        const existing = bySeriesForever.get(b.seriesId);
        if (!existing || b.dueDate < existing.dueDate) bySeriesForever.set(b.seriesId, b);
        continue; // skip adding this row directly — handled below
      }
    }
  }

  const kept = bills.filter(b => {
    if (b.seriesId && b.endType === 'forever') {
      const isFutureUnpaid = !isBillPaid(b) && b.dueDate >= today;
      return !isFutureUnpaid; // drop all future/unpaid forever rows except the placeholder we'll add back
    }
    return true;
  });

  const placeholders = Array.from(bySeriesForever.values()).map(b => ({ ...b, isSeriesPlaceholder: true }));

  return [...kept, ...placeholders];
}

// After import, any row flagged isSeriesPlaceholder represents "regenerate
// this forever series starting here" — expand it back into a real occurrence
// plus the same rolling window the app normally keeps materialized.
function expandAfterImport(bills) {
  const out = [];
  for (const b of bills) {
    if (b.isSeriesPlaceholder && b.seriesId && b.frequency && b.seriesStartDate) {
      const template = {
        type: b.type || 'bill',
        seriesId: b.seriesId,
        name: b.name,
        category: b.category,
        budgetAmount: b.budgetAmount,
        notes: b.notes,
        frequency: b.frequency,
        seriesStartDate: b.seriesStartDate,
        endType: b.endType,
        occurrenceLimit: b.occurrenceLimit,
        autoPay: b.autoPay || false,
      };
      const startIndex = b.occurrenceIndex != null ? b.occurrenceIndex : 0;
      const regenerated = generateOccurrences(template, startIndex, FOREVER_GENERATION_WINDOW);
      out.push(...regenerated);
    } else {
      const { isSeriesPlaceholder, ...rest } = b;
      out.push(rest);
    }
  }
  return out;
}

function billsToCSV(bills) {
  const header = [...CSV_COLUMNS, 'isSeriesPlaceholder'].join(',');
  const rows = bills.map(b => [...CSV_COLUMNS, 'isSeriesPlaceholder'].map(col => {
    const v = b[col];
    if (v === undefined || v === null) return '';
    const s = typeof v === 'string' ? v.replace(/"/g, '""') : String(v);
    return /[",\n]/.test(s) ? `"${s}"` : s;
  }).join(','));
  return [header, ...rows].join('\n');
}

function parseCSVLine(line) {
  const out = [];
  let cur = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQuotes) {
      if (c === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; } else { inQuotes = false; }
      } else { cur += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { out.push(cur); cur = ''; }
      else cur += c;
    }
  }
  out.push(cur);
  return out;
}

function csvToBills(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
  if (lines.length < 2) return [];
  const header = parseCSVLine(lines[0]).map(h => h.trim());
  const bills = [];
  for (let i = 1; i < lines.length; i++) {
    const cells = parseCSVLine(lines[i]);
    const row = {};
    header.forEach((h, idx) => { row[h] = cells[idx]; });
    bills.push({
      id: uid(),
      type: row.type === 'income' ? 'income' : 'bill',
      name: row.name || 'Untitled',
      category: row.category || 'Other',
      budgetAmount: parseFloat(row.budgetAmount) || 0,
      paidAmount: parseFloat(row.paidAmount) || 0,
      dueDate: row.dueDate || todayISO(),
      isPaid: String(row.isPaid).toLowerCase() === 'true',
      notes: row.notes || '',
      recurring: String(row.recurring).toLowerCase() === 'true',
      autoPay: String(row.autoPay).toLowerCase() === 'true',
      seriesId: row.seriesId || null,
      occurrenceIndex: row.occurrenceIndex !== undefined && row.occurrenceIndex !== '' ? parseInt(row.occurrenceIndex) : null,
      frequency: row.frequency || null,
      seriesStartDate: row.seriesStartDate || null,
      endType: row.endType || null,
      occurrenceLimit: row.occurrenceLimit !== undefined && row.occurrenceLimit !== '' ? parseInt(row.occurrenceLimit) : null,
      isSeriesPlaceholder: String(row.isSeriesPlaceholder).toLowerCase() === 'true',
    });
  }
  return bills;
}

function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ============================================================
   ROOT APP
   ============================================================ */

function App() {
  const [bills, setBills] = useState(() => loadBills());
  const [settings, setSettings] = useState(() => loadSettings());
  const [view, setView] = useState('list');
  const [showSettings, setShowSettings] = useState(false);
  const [showAddEdit, setShowAddEdit] = useState(null);
  const [partialPaymentBill, setPartialPaymentBill] = useState(null);
  const [editBudgetBill, setEditBudgetBill] = useState(null);
  const [periodOffset, setPeriodOffset] = useState(0);
  const [toast, setToast] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null); // { bill, scope: 'occurrence' | 'all' }
  const [confirmClearAll, setConfirmClearAll] = useState(false);
  const [syncStatus, setSyncStatus] = useState('idle'); // idle | syncing | synced | error | offline
  const [syncError, setSyncError] = useState('');
  const fileInputRef = useRef(null);
  const hasPulledRef = useRef(false);
  const skipNextBillsPushRef = useRef(false);
  const skipNextSettingsPushRef = useRef(false);

  useEffect(() => { saveBills(bills); }, [bills]);
  useEffect(() => { saveSettings(settings); }, [settings]);

  // On app open: if a NAS connection is configured, try to pull the latest
  // bills/settings from it first. If that succeeds, the server's copy wins
  // (it's the shared source of truth across devices). If it fails for any
  // reason — NAS asleep, no network, wrong key — fall back silently to
  // whatever's already cached locally, so the app still opens and works.
  useEffect(() => {
    if (!syncConfigured(settings)) return;
    let cancelled = false;
    setSyncStatus('syncing');
    (async () => {
      try {
        const [remoteBills, remoteSettings] = await Promise.all([
          syncPullBills(settings),
          syncPullSettings(settings),
        ]);
        if (cancelled) return;
        if (Array.isArray(remoteBills) && remoteBills.length > 0) {
          skipNextBillsPushRef.current = true;
          setBills(remoteBills);
        } else {
          // Server has no bills yet (brand new / first-ever connection) —
          // push this device's current local bills up immediately, rather
          // than silently waiting for the next edit to trigger a sync.
          hasPulledRef.current = true;
          syncPushBills(settings, bills).catch(() => {});
        }
        if (remoteSettings && typeof remoteSettings === 'object') {
          skipNextSettingsPushRef.current = true;
          setSettings(prev => ({ ...prev, ...remoteSettings, syncUrl: prev.syncUrl, syncKey: prev.syncKey }));
        }
        setSyncStatus('synced');
        setSyncError('');
      } catch (err) {
        if (cancelled) return;
        setSyncStatus('offline');
        setSyncError(err.message || 'Could not reach server');
      } finally {
        hasPulledRef.current = true;
      }
    })();
    return () => { cancelled = true; };
    // Only run this on mount / when the connection target changes, not on
    // every settings change (which would include unrelated preference edits).
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [settings.syncUrl, settings.syncKey]);

  // Push bills to the NAS shortly after they change locally, debounced so
  // rapid edits (e.g. typing an amount) don't fire a request per keystroke.
  useEffect(() => {
    if (!syncConfigured(settings)) return;
    if (!hasPulledRef.current) return; // don't push before the initial pull resolves
    if (skipNextBillsPushRef.current) { skipNextBillsPushRef.current = false; return; }
    setSyncStatus('syncing');
    const timer = setTimeout(() => {
      syncPushBills(settings, bills)
        .then(() => { setSyncStatus('synced'); setSyncError(''); })
        .catch((err) => { setSyncStatus('error'); setSyncError(err.message || 'Sync failed'); });
    }, 900);
    return () => clearTimeout(timer);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [bills]);

  // Same debounced push for settings (preferences only — credentials are
  // stripped out inside syncPushSettings before the request is sent).
  useEffect(() => {
    if (!syncConfigured(settings)) return;
    if (!hasPulledRef.current) return;
    if (skipNextSettingsPushRef.current) { skipNextSettingsPushRef.current = false; return; }
    const timer = setTimeout(() => {
      syncPushSettings(settings, settings).catch(() => {
        // Settings sync failures are quieter than bills failures — the
        // bills push effect already surfaces connectivity problems.
      });
    }, 900);
    return () => clearTimeout(timer);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [settings]);

  // Auto-pay sweep: runs once when the app opens. Any entry (bill or income)
  // flagged autoPay whose due date has arrived and isn't already marked
  // paid/received gets marked in full automatically, same as a manual swipe.
  useEffect(() => {
    const today = todayISO();
    setBills(prev => {
      let changed = false;
      const next = prev.map(b => {
        if (b.autoPay && !isBillPaid(b) && b.dueDate <= today) {
          changed = true;
          return { ...b, paidAmount: b.budgetAmount, isPaid: true };
        }
        return b;
      });
      return changed ? next : prev;
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const colors = useMemo(() => themeVars(settings.theme), [settings.theme]);

  function showToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(null), 2200);
  }

  function upsertBill(bill) {
    setBills(prev => {
      const exists = prev.some(b => b.id === bill.id);
      if (exists) return prev.map(b => (b.id === bill.id ? bill : b));
      return [...prev, bill];
    });
  }

  function deleteBill(id) {
    setBills(prev => prev.filter(b => b.id !== id));
    showToast('Bill deleted');
  }

  // Saves edits to just the one occurrence the person selected. If it was
  // part of a series, it's detached so future series-wide edits won't
  // overwrite it again.
  function saveOccurrenceOnly(updated) {
    upsertBill({ ...updated, seriesId: null, frequency: null, seriesStartDate: null, endType: null, occurrenceLimit: null, occurrenceIndex: null });
    showToast('This occurrence updated');
  }

  // Saves edits to this occurrence and propagates them to every UNPAID
  // sibling in the series, past or future, then regenerates the forward
  // window using the new rule. Paid occurrences (real payment history) are
  // always left untouched.
  function saveAllInSeries(updated, originalBill) {
    const seriesId = originalBill.seriesId || uid();
    setBills(prev => {
      const startIndex = originalBill.occurrenceIndex != null ? originalBill.occurrenceIndex : 0;

      // Recompute the series anchor date so it's consistent with the
      // person's edited due date for THIS occurrence — otherwise later
      // occurrences in the regenerated window would drift back to the old
      // cadence instead of continuing from the corrected date.
      const recomputedSeriesStart = advanceDateByFrequency(updated.dueDate, updated.frequency, -startIndex);

      const newTemplate = {
        type: updated.type || 'bill',
        seriesId,
        name: updated.name,
        category: updated.category,
        budgetAmount: updated.budgetAmount,
        notes: updated.notes,
        frequency: updated.frequency,
        seriesStartDate: recomputedSeriesStart,
        endType: updated.endType,
        occurrenceLimit: updated.occurrenceLimit,
        autoPay: updated.autoPay || false,
      };

      // Keep every bill NOT in this series untouched, plus any sibling that
      // IS paid (preserve their own dates/amounts as payment history).
      const kept = prev.filter(b => b.seriesId !== seriesId || isBillPaid(b));

      const totalAllowed = totalOccurrencesFor(newTemplate);
      const remainingSlots = totalAllowed === Infinity
        ? FOREVER_GENERATION_WINDOW
        : Math.max(0, totalAllowed - startIndex);

      const regenerated = generateOccurrences(newTemplate, startIndex, Math.min(remainingSlots, FOREVER_GENERATION_WINDOW));

      return [...kept, ...regenerated];
    });
    showToast('This and all future occurrences updated');
  }

  // Deletes just the one occurrence the person selected.
  function deleteOccurrenceOnly(bill) {
    deleteBill(bill.id);
  }

  // Deletes this occurrence and every UNPAID sibling in the series, past or
  // future, and stops generating new ones. Paid siblings are kept as history.
  function deleteAllInSeries(bill) {
    const seriesId = bill.seriesId;
    setBills(prev => prev.filter(b => b.seriesId !== seriesId || isBillPaid(b)));
    showToast('This and all future occurrences deleted');
  }

  function markPaidFull(bill) {
    upsertBill({ ...bill, isPaid: true, paidAmount: bill.budgetAmount });
    showToast(bill.type === 'income' ? `${bill.name} marked received in full` : `${bill.name} marked paid in full`);
  }

  function unmarkPaid(bill) {
    upsertBill({ ...bill, isPaid: false, paidAmount: 0 });
    showToast(bill.type === 'income' ? `${bill.name} moved back to not received` : `${bill.name} moved back to unpaid`);
  }

  function applyPartialPayment(bill, amount) {
    const newPaid = bill.paidAmount + amount;
    upsertBill({ ...bill, paidAmount: newPaid, isPaid: newPaid >= bill.budgetAmount });
    showToast(bill.type === 'income' ? `Logged ${formatMoney(amount)} received from ${bill.name}` : `Logged ${formatMoney(amount)} toward ${bill.name}`);
  }

  function applyBudgetEdit(bill, amount) {
    upsertBill({ ...bill, budgetAmount: amount, isPaid: bill.paidAmount >= amount });
    showToast(bill.type === 'income' ? `Amount updated for ${bill.name}` : `Budget updated for ${bill.name}`);
  }

  function runSwipeAction(action, bill) {
    if (action === 'paidFull') {
      if (isBillPaid(bill)) unmarkPaid(bill);
      else markPaidFull(bill);
    }
    else if (action === 'paidPartial') setPartialPaymentBill(bill);
    else if (action === 'editBudget') setEditBudgetBill(bill);
  }

  function handleExportCSV() {
    const exportable = collapseForExport(bills);
    downloadFile(`bills-export-${todayISO()}.csv`, billsToCSV(exportable), 'text/csv');
    showToast('Bills exported to CSV');
  }

  function handleExportJSON() {
    const exportable = collapseForExport(bills);
    downloadFile(`bills-export-${todayISO()}.json`, JSON.stringify(exportable, null, 2), 'application/json');
    showToast('Bills exported to JSON');
  }

  function handleImportFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const text = String(reader.result);
        let imported = [];
        if (file.name.endsWith('.json')) {
          const parsed = JSON.parse(text);
          imported = parsed.map(b => ({ ...b, id: uid() }));
        } else {
          imported = csvToBills(text);
        }
        if (imported.length === 0) {
          showToast('No bills found in file');
          return;
        }
        const expanded = expandAfterImport(imported);
        setBills(prev => [...prev, ...expanded]);
        showToast(`Imported ${expanded.length} bill${expanded.length === 1 ? '' : 's'}`);
      } catch {
        showToast('Could not read that file');
      }
    };
    reader.readAsText(file);
  }

  function handleGoogleDriveConnect() {
    showToast('Connect a Google Client ID in Settings to enable Drive sync');
  }

  function handleClearAll() {
    setBills([]);
    showToast('All bills cleared');
  }

  const period = useMemo(() => {
    if (settings.periodMode === 'monthly') {
      const base = new Date();
      base.setMonth(base.getMonth() + periodOffset);
      const start = new Date(base.getFullYear(), base.getMonth(), 1);
      const end = new Date(base.getFullYear(), base.getMonth() + 1, 0);
      return { start: toISO(start), end: toISO(end), label: `${MONTH_NAMES[start.getMonth()]} ${start.getFullYear()}` };
    } else {
      const todayPeriod = getBiweeklyPeriod(todayISO(), settings.biweeklyAnchorDate);
      const start = parseISO(todayPeriod.start);
      start.setDate(start.getDate() + periodOffset * 14);
      const end = new Date(start);
      end.setDate(end.getDate() + 13);
      return {
        start: toISO(start),
        end: toISO(end),
        label: `${formatDateShort(toISO(start))} – ${formatDateShort(toISO(end))}`,
      };
    }
  }, [settings.periodMode, settings.biweeklyAnchorDate, periodOffset]);

  const billsInPeriod = useMemo(() => {
    return bills
      .filter(b => b.type !== 'income' && b.dueDate >= period.start && b.dueDate <= period.end)
      .sort((a, b) => a.dueDate.localeCompare(b.dueDate));
  }, [bills, period]);

  const incomeInPeriod = useMemo(() => {
    return bills
      .filter(b => b.type === 'income' && b.dueDate >= period.start && b.dueDate <= period.end)
      .sort((a, b) => a.dueDate.localeCompare(b.dueDate));
  }, [bills, period]);

  // Bills that are overdue and due before this period even started — only
  // surfaced when looking at the current period (offset 0), since "carried
  // over" is relative to today, not to whatever period happens to be on screen.
  const carryoverBills = useMemo(() => {
    if (periodOffset !== 0) return [];
    return bills
      .filter(b => b.type !== 'income' && !isBillPaid(b) && b.dueDate < period.start && daysUntil(b.dueDate) < 0)
      .sort((a, b) => a.dueDate.localeCompare(b.dueDate));
  }, [bills, period, periodOffset]);

  const periodTotals = useMemo(() => {
    const budgeted = billsInPeriod.reduce((s, b) => s + b.budgetAmount, 0);
    const paid = billsInPeriod.reduce((s, b) => s + b.paidAmount, 0);
    const remaining = budgeted - paid;
    const overdue = billsInPeriod.filter(b => !isBillPaid(b) && daysUntil(b.dueDate) < 0).length + carryoverBills.length;
    const incomeBudgeted = incomeInPeriod.reduce((s, b) => s + b.budgetAmount, 0);
    const incomeReceived = incomeInPeriod.reduce((s, b) => s + b.paidAmount, 0);
    const playMoney = incomeBudgeted - budgeted;
    return { budgeted, paid, remaining, overdue, incomeBudgeted, incomeReceived, playMoney };
  }, [billsInPeriod, incomeInPeriod, carryoverBills]);

  return (
    <div style={{
      fontFamily: "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
      background: colors.bg, color: colors.text, minHeight: '100vh', width: '100%',
      transition: 'background 0.2s, color 0.2s',
    }}>
      <style>{`
        * { box-sizing: border-box; }
        input, select, textarea, button { font-family: inherit; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: ${colors.border}; border-radius: 4px; }
        @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .toast-anim { animation: slideUp 0.2s ease-out; }
        .modal-anim { animation: fadeIn 0.15s ease-out; }
      `}</style>

      <Header colors={colors} view={view} setView={setView} onSettings={() => setShowSettings(true)} onAdd={() => setShowAddEdit('new')} syncStatus={syncStatus} />
      {view !== 'history' && (
        <PeriodBar colors={colors} settings={settings} period={period} periodOffset={periodOffset} setPeriodOffset={setPeriodOffset} totals={periodTotals} />
      )}

      <main style={{ maxWidth: 720, margin: '0 auto', padding: '0 16px 100px' }}>
        {view === 'list' && (
          <ListView colors={colors} bills={billsInPeriod} incomeInPeriod={incomeInPeriod} carryoverBills={carryoverBills} settings={settings} onSwipe={runSwipeAction} onTap={(b) => setShowAddEdit(b)} />
        )}
        {view === 'calendar' && (
          <CalendarView colors={colors} allBills={bills} period={period} onSelectBill={(b) => setShowAddEdit(b)} />
        )}
        {view === 'history' && (
          <HistoryView colors={colors} allBills={bills} settings={settings} onSelectBill={(b) => setShowAddEdit(b)} />
        )}
      </main>

      <input
        ref={fileInputRef}
        type="file"
        accept=".csv,.json"
        style={{ display: 'none' }}
        onChange={(e) => {
          const f = e.target.files && e.target.files[0];
          if (f) handleImportFile(f);
          e.target.value = '';
        }}
      />

      {showSettings && (
        <SettingsModal
          colors={colors}
          settings={settings}
          setSettings={setSettings}
          onClose={() => setShowSettings(false)}
          onExportCSV={handleExportCSV}
          onExportJSON={handleExportJSON}
          onImportClick={() => fileInputRef.current && fileInputRef.current.click()}
          onGoogleDrive={handleGoogleDriveConnect}
          onClearAll={() => setConfirmClearAll(true)}
          syncStatus={syncStatus}
          syncError={syncError}
        />
      )}

      {showAddEdit && (
        <BillEditModal
          colors={colors}
          bill={showAddEdit === 'new' ? null : showAddEdit}
          onClose={() => setShowAddEdit(null)}
          onSaveOccurrence={(updated) => { saveOccurrenceOnly(updated); setShowAddEdit(null); }}
          onSaveAll={(updated, original) => { saveAllInSeries(updated, original); setShowAddEdit(null); }}
          onSaveNew={(b) => { upsertBill(b); setShowAddEdit(null); showToast('Bill added'); }}
          onSaveNewSeries={(template, count) => {
            const occurrences = generateOccurrences(template, 0, count);
            setBills(prev => [...prev, ...occurrences]);
            setShowAddEdit(null);
            showToast(`Bill added — ${count} occurrence${count === 1 ? '' : 's'} scheduled`);
          }}
          onRequestDelete={(bill, scope) => { setConfirmDelete({ bill, scope }); setShowAddEdit(null); }}
        />
      )}

      {partialPaymentBill && (
        <PartialPaymentModal colors={colors} bill={partialPaymentBill} onClose={() => setPartialPaymentBill(null)} onConfirm={(amt) => { applyPartialPayment(partialPaymentBill, amt); setPartialPaymentBill(null); }} />
      )}

      {editBudgetBill && (
        <EditBudgetModal colors={colors} bill={editBudgetBill} onClose={() => setEditBudgetBill(null)} onConfirm={(amt) => { applyBudgetEdit(editBudgetBill, amt); setEditBudgetBill(null); }} />
      )}

      {confirmDelete && (
        <ConfirmModal
          colors={colors}
          title={confirmDelete.scope === 'all' ? 'Delete this and all future occurrences?' : 'Delete this occurrence?'}
          message={confirmDelete.scope === 'all'
            ? `"${confirmDelete.bill.name}" — this and every unpaid occurrence (past or future) will be permanently removed. Paid occurrences are kept as history.`
            : `"${confirmDelete.bill.name}" on ${formatDateShort(confirmDelete.bill.dueDate)} will be permanently removed.`}
          confirmLabel="Delete"
          danger
          onCancel={() => setConfirmDelete(null)}
          onConfirm={() => {
            if (confirmDelete.scope === 'all') deleteAllInSeries(confirmDelete.bill);
            else deleteOccurrenceOnly(confirmDelete.bill);
            setConfirmDelete(null);
          }}
        />
      )}

      {confirmClearAll && (
        <ConfirmModal
          colors={colors}
          title="Clear all bills?"
          message="Every bill will be permanently removed from this device. This can't be undone unless you've exported a backup."
          confirmLabel="Clear all"
          danger
          onCancel={() => setConfirmClearAll(false)}
          onConfirm={() => { handleClearAll(); setConfirmClearAll(false); }}
        />
      )}

      {toast && (
        <div className="toast-anim" style={{
          position: 'fixed', bottom: 24, left: '50%', transform: 'translateX(-50%)',
          background: colors.text, color: colors.bg, padding: '10px 18px',
          borderRadius: 10, fontSize: 14, fontWeight: 500, zIndex: 200,
          boxShadow: '0 4px 16px rgba(0,0,0,0.2)', maxWidth: '90%', textAlign: 'center',
        }}>
          {toast}
        </div>
      )}
    </div>
  );
}

  if (totalCount === 0) {

      </div>
    );

  const overdueInPeriod = bills.filter(b => !isBillPaid(b) && daysUntil(b.dueDate) < 0);
  const upcoming = bills.filter(b => !isBillPaid(b) && daysUntil(b.dueDate) >= 0);
  const paidBills = bills.filter(b => isBillPaid(b));

  const incomeUpcoming = (incomeInPeriod || []).filter(b => !isBillPaid(b));
  const incomeReceived = (incomeInPeriod || []).filter(b => isBillPaid(b));

  // Received income joins paid bills in one combined "Paid" section, sorted
  // by due/pay date so the two types interleave naturally rather than

  const paid = [...paidBills, ...incomeReceived].sort((a, b) => a.dueDate.localeCompare(b.dueDate));

        ))}

function SwipeableRow({ bill, colors, settings, onSwipe, onTap }) {
  const [dragX, setDragX] = useState(0);
  const [dragging, setDragging] = useState(false);
  const startX = useRef(0);
  const THRESHOLD = 76;

  const leftAction = settings.swipeLeft;
  const rightAction = settings.swipeRight;

  function onPointerDown(e) {
    startX.current = e.clientX;
    setDragging(true);
    e.target.setPointerCapture(e.pointerId);
  }
  function onPointerMove(e) {
    if (!dragging) return;
    let delta = e.clientX - startX.current;
    if (delta > 0 && rightAction === 'none') delta = 0;
    if (delta < 0 && leftAction === 'none') delta = 0;
    delta = Math.max(-130, Math.min(130, delta));
    setDragX(delta);
  }
  function onPointerUp() {
    setDragging(false);
    if (dragX > THRESHOLD && rightAction !== 'none') {
      onSwipe(rightAction, bill);
    } else if (dragX < -THRESHOLD && leftAction !== 'none') {
      onSwipe(leftAction, bill);
    }
    setDragX(0);
  }

  const billPaid = isBillPaid(bill);
  const overdue = !billPaid && daysUntil(bill.dueDate) < 0;
  const dueSoon = !billPaid && daysUntil(bill.dueDate) >= 0 && daysUntil(bill.dueDate) <= 3;

  const showRight = dragX > 8;
  const showLeft = dragX < -8;

  const isIncome = bill.type === 'income';

  function actionLabel(action) {
    if (action === 'paidFull') return billPaid ? (isIncome ? 'Not received' : 'Unpaid') : (isIncome ? 'Received' : 'Paid');
    if (action === 'paidPartial') return isIncome ? 'Partial' : 'Partial';
    if (action === 'editBudget') return isIncome ? 'Edit amount' : 'Edit';
    return ACTION_SHORT_LABELS[action];
  }

  function actionIcon(action) {
    if (action === 'paidFull' && billPaid) return UndoIcon;
    return ACTION_ICON_COMPONENTS[action];
  }

  return (
    <div style={{ position: 'relative', borderRadius: 14, overflow: 'hidden' }}>
      <div style={{ position: 'absolute', inset: 0, display: 'flex', justifyContent: showRight ? 'flex-start' : 'flex-end' }}>
        {showRight && rightAction !== 'none' && (() => { const RightIcon = actionIcon(rightAction); return (
          <div style={{ background: ACTION_COLORS[rightAction], color: '#fff', display: 'flex', alignItems: 'center', gap: 6, padding: '0 18px', height: '100%', fontSize: 13, fontWeight: 600, width: Math.abs(dragX), overflow: 'hidden', whiteSpace: 'nowrap' }}>
            <RightIcon size={18} style={{ flexShrink: 0 }} />
            {Math.abs(dragX) > 70 && actionLabel(rightAction)}
          </div>
        ); })()}
        {showLeft && leftAction !== 'none' && (() => { const LeftIcon = actionIcon(leftAction); return (
          <div style={{ background: ACTION_COLORS[leftAction], color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'flex-end', gap: 6, padding: '0 18px', height: '100%', fontSize: 13, fontWeight: 600, width: Math.abs(dragX), overflow: 'hidden', whiteSpace: 'nowrap' }}>
            {Math.abs(dragX) > 70 && actionLabel(leftAction)}
            <LeftIcon size={18} style={{ flexShrink: 0 }} />
          </div>
        ); })()}
      </div>

      <div
        onPointerDown={onPointerDown}
        onPointerMove={onPointerMove}
        onPointerUp={onPointerUp}
        onPointerCancel={onPointerUp}
        onClick={() => { if (Math.abs(dragX) < 4) onTap(bill); }}
        style={{
          position: 'relative',
          transform: `translateX(${dragX}px)`,
          transition: dragging ? 'none' : 'transform 0.2s ease-out',
          background: colors.bgElevated,
          border: `1px solid ${colors.border}`,
          borderRadius: 14,
          padding: '14px 16px',
          cursor: 'pointer',
          touchAction: 'pan-y',
          userSelect: 'none',
        }}
      >
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 10 }}>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ fontSize: 15, fontWeight: 600, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{bill.name}</span>
              {billPaid && <CheckCircleIcon size={16} style={{ color: colors.green }} />}
              {!billPaid && bill.autoPay && (
                <span style={{
                  fontSize: 9.5, fontWeight: 600, padding: '2px 6px', borderRadius: 5, flexShrink: 0,
                  background: colors.blueBg, color: colors.blueText, textTransform: 'uppercase', letterSpacing: 0.3,
                }} title={isIncome ? 'Will be marked received automatically on the pay date' : 'Will be marked paid automatically on the due date'}>
                  Auto
                </span>
              )}
            </div>
            <div style={{ fontSize: 12.5, color: colors.textMuted, marginTop: 2 }}>{bill.category}</div>
          </div>
          <div style={{ textAlign: 'right', flexShrink: 0 }}>
            <div style={{ fontSize: 15, fontWeight: 600 }}>{formatMoney(bill.budgetAmount)}</div>
            <div style={{ fontSize: 12, marginTop: 2, color: overdue ? colors.red : dueSoon ? colors.amber : colors.textMuted, fontWeight: overdue || dueSoon ? 600 : 400 }}>
              {overdue ? `Overdue · ${formatDateShort(bill.dueDate)}` : formatDateShort(bill.dueDate)}
            </div>
          </div>
        </div>

        {!billPaid && bill.paidAmount > 0 && (
          <div style={{ marginTop: 10 }}>
            <div style={{ height: 4, background: colors.borderSoft, borderRadius: 3, overflow: 'hidden' }}>
              <div style={{ height: '100%', borderRadius: 3, background: colors.blue, width: `${Math.min(100, (bill.paidAmount / bill.budgetAmount) * 100)}%` }} />
            </div>
            <div style={{ fontSize: 11.5, color: colors.textMuted, marginTop: 4 }}>
              {formatMoney(bill.paidAmount)} of {formatMoney(bill.budgetAmount)} paid
            </div>
          </div>
        )}
      </div>
    </div>
  );
}
